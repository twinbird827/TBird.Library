<!--
    Reader 画面の WebView 用 HTML テンプレート(横書き・縦書き共用)。EmbeddedResource として DLL に埋め込まれ、
    ReaderHtmlBuilder.Build() が起動時に 1 回だけ読み込み、以降は static キャッシュを使用。

    プレースホルダー (string.Replace 置換):
      __FS__    : フォントサイズ (px 単位、例 "16")
      __LH__    : 行間倍率 (例 "1.7")
      __BG__    : 背景色 (例 "#FFFFFF")
      __FG__    : 文字色 (例 "#212121")
      __DIR__   : 書字方向の <html> の class ("horizontal" / "vertical")
      __BODY__  : EpisodeContentFormat.ToHtml() が作る本文 HTML (<p>・前書き/後書きの <div>・挿絵の <img>)
      __POS__   : 復元するスクロール位置の比率 (0〜1、"0"=先頭)

    NOTE: 下部 <script> の read-end / next-episode / prev-episode / scroll URI 発火は
    ReaderPage.OnWebViewNavigating と連動しているため変更禁止。
-->
<!doctype html><html lang="ja" class="__DIR__"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--reader-fs:__FS__px;--reader-lh:__LH__;--reader-bg:__BG__;--reader-fg:__FG__;}
html,body{margin:0;padding:0;height:100%;}
html.vertical,html.vertical body{overflow-y:hidden;}
html.horizontal body{height:auto;min-height:100%;}
body{
  background:var(--reader-bg);color:var(--reader-fg);
  font-family:serif;
  font-size:var(--reader-fs);line-height:var(--reader-lh);
  padding:16px;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html.vertical body{
  writing-mode:vertical-rl;
  overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior-y:none;
}
p{margin:0 0 1em 0;text-indent:1em;}
html.horizontal p{margin:0;}
html.horizontal p:empty::before{content:"\200B";}
.preface,.afterword{color:color-mix(in srgb,var(--reader-fg) 60%,var(--reader-bg));}
.preface{border-block-end:1px solid currentColor;padding-block-end:1em;margin-block-end:1em;}
.afterword{border-block-start:1px solid currentColor;padding-block-start:1em;margin-block-start:1em;}
img{display:block;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);margin-block:1em;}
</style></head><body>
__BODY__
<script>
var vertical=document.documentElement.classList.contains('vertical');
var pos=__POS__;
function scroller(){return document.scrollingElement||document.documentElement;}
function atEnd(){var el=scroller();
  return vertical
    ?el.scrollLeft<=-(el.scrollWidth-el.clientWidth)+10
    :el.scrollTop+el.clientHeight>=el.scrollHeight-10;}
// 現在位置の比率。縦書き(vertical-rl)の scrollLeft は 0 から負へ進む。末尾到達は 0(読了後の再読は先頭から)。
function ratio(){var el=scroller();
  var max=vertical?el.scrollWidth-el.clientWidth:el.scrollHeight-el.clientHeight;
  if(max<=0||atEnd())return 0;
  return Math.min(1,(vertical?-el.scrollLeft:el.scrollTop)/max);}
(function(){var fired=false;function check(){if(fired)return;
  if(atEnd()){fired=true;location.href='lanobe://read-end';}}
  window.addEventListener('scroll',check,{passive:true});setTimeout(check,100);})();
// 挿絵の読込で高さが確定した後に復元する。
window.addEventListener('load',function(){if(pos<=0)return;var el=scroller();
  if(vertical)el.scrollLeft=-pos*(el.scrollWidth-el.clientWidth);
  else el.scrollTop=pos*(el.scrollHeight-el.clientHeight);});
// スクロール停止 500ms 後に位置を通知する(プロセス終了前の保存処理に頼らない)。
(function(){var t;window.addEventListener('scroll',function(){clearTimeout(t);
  t=setTimeout(function(){location.href='lanobe://scroll?r='+ratio().toFixed(4);},500);},{passive:true});})();
(function(){var sx,sy,st;
  document.addEventListener('touchstart',function(e){
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
  },{passive:true});
  document.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx;
    var dy=e.changedTouches[0].clientY-sy;
    var dt=Date.now()-st;
    if(dt>300)return;
    // 縦書きは上下スワイプ(上で次話)、横書きは左右スワイプ(左で次話)。
    var d=vertical?dy:dx,o=vertical?dx:dy;
    if(Math.abs(d)>Math.abs(o)&&Math.abs(d)>80){
      if(d<0)location.href='lanobe://next-episode';
      else location.href='lanobe://prev-episode';}
  },{passive:true});})();
</script>
</body></html>
